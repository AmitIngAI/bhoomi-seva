server.port=${PORT:8080}
spring.application.name=Bhoomi Seva Backend

# ===== DATABASE (TiDB / MySQL from Render env) =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== ADMIN BOOTSTRAP =====
app.admin.email=${ADMIN_EMAIL:admin@bhoomiseva.gov.in}
app.admin.password=${ADMIN_PASS}
app.admin.name=${ADMIN_NAME:System Administrator}
app.admin.mobile=${ADMIN_MOBILE:9999999999}

# ===== ML API =====
ml.api.url=${ML_API_URL:http://localhost:5000}